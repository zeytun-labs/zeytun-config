[package]
name = "zeytun-config"
version = "0.1.0"
edition = "2021"
description = "Parse proxy share links into sing-box outbound JSON (Zeytun)"
license = "MIT"
readme = "README.md"

[dependencies]
base64 = "0.22"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2.5"

[[bin]]
name = "zeytun-config"
path = "src/main.rs"
